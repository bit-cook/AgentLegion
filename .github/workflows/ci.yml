name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # Self-hosted runner (registered on the maintainer's machine) — GitHub-hosted
    # runners queue for hours on this account.
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all sources
        run: python -m compileall -q agent_legion tests main.py experiment.py config.py

      - name: Run test suite
        run: python -m unittest discover tests -v

      - name: CLI smoke (demo)
        run: python main.py --seed 42 --generations 10 --population 30 --quiet

      - name: CLI smoke (experiment)
        run: python experiment.py --trials 2 --generations 5 --quiet --csv /tmp/ci_results.csv --report /tmp/ci_report.md

      - name: Verify report contains real generated numbers
        run: |
          grep -q "Generated by" /tmp/ci_report.md
          grep -q "Best score, final generation" /tmp/ci_report.md
          test -s /tmp/ci_results.csv
